kind = "web"
previewPath = "/"
title = "Fooder"
version = "1.0.0"
id = "artifacts/fooder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18320

[services.development]
run = "pnpm --filter @workspace/fooder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fooder", "run", "build" ]
publicDir = "artifacts/fooder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18320"
BASE_PATH = "/"
